[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/e-kulikov/ruwana"

[workspace.dependencies]
ruwana-core = { path = "crates/core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
rand = "0.9"
walkdir = "2"
rayon = "1"
interim = { version = "0.2", features = ["chrono_0_4"] }
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
